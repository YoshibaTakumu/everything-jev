name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Check the pinned pnpm version
        run: |
          expected=$(node -p "require('./package.json').packageManager")
          actual="pnpm@$(pnpm --version)"
          if [ "$actual" != "$expected" ]; then
            echo "Expected $expected, got $actual" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Check dependency graph compatibility
        run: |
          if grep -q '^---' pnpm-lock.yaml; then
            echo 'GitHub dependency scanning requires a single-document lockfile; see docs/quality.md.' >&2
            exit 1
          fi
          git diff --exit-code -- pnpm-lock.yaml
      - name: Check commit messages
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [[ "$GITHUB_REF" == refs/heads/release-please--* ]]; then
            COMMIT_BASE=$(git merge-base origin/main "$COMMIT_HEAD")
          fi
          if [ -n "$COMMIT_BASE" ] && [ "$COMMIT_BASE" != 0000000000000000000000000000000000000000 ]; then
            pnpm commitlint --from "$COMMIT_BASE" --to "$COMMIT_HEAD" --verbose
          else
            pnpm commitlint --last --verbose
          fi
      - run: pnpm verify
      - run: node dist/cli.js demo all > /dev/null
      - run: node examples/harness.mjs

  dependency-review:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release-please--'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || 'refs/heads/main' }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fail-on-severity: moderate
          comment-summary-in-pr: never
          license-check: false

  release-status:
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/heads/release-please--')
    needs: [verify, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Attach dispatched CI result to the release PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if [ "$VERIFY_RESULT" = success ] && [ "$DEPENDENCY_RESULT" = success ]; then
            state=success
          fi
          gh api --method POST "repos/$GH_REPO/statuses/$COMMIT_SHA" \
            -f state="$state" \
            -f context='CI / release checks' \
            -f description='Formatting, lint, tests and dependency review' \
            -f target_url="$RUN_URL"
